services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build: .
    container_name: booking-api-prod
    ports:
      - "100.94.65.11:8080:8080"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data_prod:
