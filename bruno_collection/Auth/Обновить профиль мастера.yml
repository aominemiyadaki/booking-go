info:
  name: Обновить профиль мастера
  type: http
  seq: 4
  tags:
    - Auth

http:
  method: PUT
  url: "{{baseUrl}}/master/profile"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "full_name": "",
        "id": "",
        "phone_number": "",
        "specialization_id": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/master/profile"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "full_name": "",
            "id": "",
            "phone_number": "",
            "specialization_id": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/master/profile"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "full_name": "",
            "id": "",
            "phone_number": "",
            "specialization_id": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "",
            "message": ""
          }

docs: Полностью обновляет информацию в профиле мастера (имя, специализация, телефон)
