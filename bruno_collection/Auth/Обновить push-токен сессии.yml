  type: http
  seq: 6
  tags:
    - Auth

http:
  method: PUT
  url: "{{baseUrl}}/master/session-token"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "token": ""
      }
