info:
  name: Редактировать/перенести запись
  type: http
  seq: 10
  tags:
    - Appointments

http:
  method: PUT
  url: "{{baseUrl}}/appointments/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: ID записи
  body:
    type: json
    data: |-
      {
        "client_id": "",
        "client_name": "",
        "client_phone": "",
        "comment": "",
        "date": "",
        "master_id": "",
        "service_id": "",
        "slot_time": "",
        "status_id": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/appointments/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: ID записи
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "client_name": "",
            "client_phone": "",
            "comment": "",
            "date": "",
            "master_id": "",
            "service_id": "",
            "slot_time": "",
            "status_id": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/appointments/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: ID записи
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "client_name": "",
            "client_phone": "",
            "comment": "",
            "date": "",
            "master_id": "",
            "service_id": "",
