info:
  name: Записи на дату
  type: http
  seq: 5
  tags:
    - Appointments

http:
  method: GET
  url: "{{baseUrl}}/appointments"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: date
      value: ""
      type: query
      description: Дата в формате YYYY-MM-DD
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/appointments"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: date
          value: ""
          type: query
          description: Дата в формате YYYY-MM-DD
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "client_id": "",
              "comment": "",
              "created_at": "",
              "end_time": "",
              "id": "",
              "master_id": "",
              "service_id": "",
              "start_time": "",
              "status_id": "",
              "version": 0,
              "visibility": false
            }
          ]
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/appointments"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: date
          value: ""
          type: query
          description: Дата в формате YYYY-MM-DD
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "",
            "message": ""
          }
