info:
  name: Создать запись (мастер)
  type: http
  seq: 6
  tags:
    - Appointments

http:
  method: POST
  url: "{{baseUrl}}/appointments"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "client_id": "",
        "client_name": "",
        "client_phone": "",
        "comment": "",
        "date": "",
        "master_id": "",
        "service_id": "",
        "slot_time": "",
        "status_id": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/appointments"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "client_name": "",
            "client_phone": "",
            "comment": "",
            "date": "",
            "master_id": "",
            "service_id": "",
            "slot_time": "",
            "status_id": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "comment": "",
            "created_at": "",
            "end_time": "",
            "id": "",
            "master_id": "",
            "service_id": "",
            "start_time": "",
            "status_id": "",
            "version": 0,
            "visibility": false
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/appointments"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "client_name": "",
            "client_phone": "",
            "comment": "",
            "date": "",
            "master_id": "",
            "service_id": "",
            "slot_time": "",
            "status_id": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "",
            "message": ""
          }
  - name: 409 Response
    description: Conflict
    request:
      url: "{{baseUrl}}/appointments"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "client_id": "",
            "client_name": "",
            "client_phone": "",
            "comment": "",
            "date": "",
            "master_id": "",
            "service_id": "",
            "slot_time": "",
            "status_id": ""
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "",
            "message": ""
          }
