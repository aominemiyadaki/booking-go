  type: http
  seq: 12
  tags:
    - Appointments

http:
  method: PATCH
  url: "{{baseUrl}}/appointments/:id/status"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: ID записи
  body:
