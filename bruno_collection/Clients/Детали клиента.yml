info:
  name: Детали клиента
  type: http
  seq: 4
  tags:
    - Clients

http:
  method: GET
  url: "{{baseUrl}}/clients/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: ID клиента
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/clients/:id"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: ID клиента
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "birth_date": "",
            "created_at": "",
            "id": "",
            "is_blocked": false,
            "last_visited": "",
            "master_id": "",
            "name": "",
            "notes": "",
            "phone_number": "",
            "telegram_id": 0,
            "telegram_username": "",
            "total_visits": 0,
            "version": 0,
            "visibility": false
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/clients/:id"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: ID клиента
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "",
            "message": ""
          }
