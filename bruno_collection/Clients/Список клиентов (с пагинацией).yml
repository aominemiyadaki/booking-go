info:
  name: Список клиентов (с пагинацией)
  type: http
  seq: 1
  tags:
    - Clients

http:
  method: GET
  url: "{{baseUrl}}/clients"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: page
      value: "1"
      type: query
      description: Номер страницы
    - name: page_size
      value: "50"
      type: query
      description: Размер страницы
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/clients"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: page
          value: "1"
          type: query
          description: Номер страницы
        - name: page_size
          value: "50"
          type: query
          description: Размер страницы
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": "",
            "page": 0,
            "page_size": 0,
            "total": 0,
            "total_pages": 0
          }
