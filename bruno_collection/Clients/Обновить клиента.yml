info:
  name: Обновить клиента
  type: http
  seq: 5
  tags:
    - Clients

http:
  method: PUT
  url: "{{baseUrl}}/clients/:id"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: ID клиента
  body:
    type: json
    data: |-
      {
        "name": "",
        "notes": "",
        "phone_number": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/clients/:id"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: ID клиента
      body:
        type: json
        data: |-
          {
            "name": "",
            "notes": "",
            "phone_number": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
