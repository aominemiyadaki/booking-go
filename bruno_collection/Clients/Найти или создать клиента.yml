info:
  name: Найти или создать клиента
  type: http
  seq: 3
  tags:
    - Clients

http:
  method: POST
  url: "{{baseUrl}}/clients/find-or-create"
  body:
    type: json
    data: |-
      {
        "master_id": "",
        "name": "",
        "phone_number": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/clients/find-or-create"
      method: POST
      body:
        type: json
        data: |-
          {
            "master_id": "",
            "name": "",
            "phone_number": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "client_id": ""
          }
