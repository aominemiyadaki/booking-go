info:
  name: Метрики приложения
  type: http
  seq: 1
  tags:
    - Monitoring

http:
  method: GET
  url: "{{baseUrl}}/metrics"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/metrics"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "gc": {
              "last_pause_ms": 0,
              "num_gc": 0,
              "pause_total_ms": 0
            },
            "go_version": "",
            "gomaxprocs": 0,
            "memory": {
              "alloc_mb": 0,
              "heap_alloc_mb": 0,
              "heap_objects": 0,
              "heap_sys_mb": 0,
              "stack_in_use_mb": 0,
              "sys_mb": 0,
              "total_alloc_mb": 0
            },
            "num_cpu": 0,
            "num_goroutine": 0,
            "process": {
              "pid": 0
            },
            "uptime": ""
          }

docs: "Возвращает потребление ресурсов: RAM, горутины, GC, uptime"
