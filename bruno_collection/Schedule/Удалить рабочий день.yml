info:
  name: Удалить рабочий день
  type: http
  seq: 3
  tags:
    - Schedule

http:
  method: DELETE
  url: "{{baseUrl}}/schedule/day"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: date
      value: ""
      type: query
      description: Дата YYYY-MM-DD
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/schedule/day"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: date
          value: ""
          type: query
          description: Дата YYYY-MM-DD
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
