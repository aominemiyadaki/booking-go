info:
  name: Сохранить рабочие слоты
  type: http
  seq: 4
  tags:
    - Schedule

http:
  method: PUT
  url: "{{baseUrl}}/schedule/slots"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "dates": [],
        "slots": [
          {
            "end": "",
            "start": ""
          }
        ]
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/schedule/slots"
      method: PUT
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "dates": [],
            "slots": [
              {
                "end": "",
                "start": ""
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
