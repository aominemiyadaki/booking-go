info:
  name: Расписание на месяц
  type: http
  seq: 1
  tags:
    - Schedule

http:
  method: GET
  url: "{{baseUrl}}/schedule"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: year_month
      value: ""
      type: query
      description: Месяц YYYY-MM
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/schedule"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: year_month
          value: ""
          type: query
          description: Месяц YYYY-MM
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "master_id": "",
            "working_days": {},
            "year_month": ""
          }
