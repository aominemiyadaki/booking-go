info:
  name: Создать перерыв мастера
  type: http
  seq: 6
  tags:
    - Breaks

http:
  method: POST
  url: "{{baseUrl}}/breaks"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "break_type_id": "",
        "end_time": "",
        "start_time": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/breaks"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "break_type_id": "",
            "end_time": "",
            "start_time": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "break_type_id": "",
            "created_at": "",
            "end_time": "",
            "id": "",
            "master_id": "",
            "start_time": "",
            "version": 0,
            "visibility": false
          }
