info:
  name: Список типов перерывов
  type: http
  seq: 1
  tags:
    - Breaks

http:
  method: GET
  url: "{{baseUrl}}/break-types"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/break-types"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "created_at": "",
              "id": "",
              "name": "",
              "version": 0,
              "visibility": false
            }
          ]
