services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  migrations:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations -database "postgres://postgres:postgres@postgres:5432/booking?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: booking-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking
      DB_SSLMODE: disable
      JWT_SECRET: docker-secret-change-in-production
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: always
